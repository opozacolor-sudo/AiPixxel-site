<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiPixxel — Consultanță marketing &amp; business</title>
<meta name="description" content="Orice afacere poate avea succes. AiPixxel leagă analiza de business cu execuția reală — strategie, ads, automatizări, email.">
<meta property="og:title" content="AiPixxel — Consultanță marketing &amp; business">
<meta property="og:description" content="Sistem integrat de creștere pentru companii care vor să scaleze cu date, nu cu intuiție.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aipixxel.online">

<link rel="canonical" href="https://aipixxel.online">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0A0A0B;
    --anthracite: #1C1C1F;
    --gold: #C9A461;
    --warm-white: #F5F2EB;
    --violet: #8B5CF6;
    --violet-dim: rgba(139,92,246,0.25);
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Outfit', system-ui, sans-serif;
    --header-h: 56px;
    --footer-h: 36px;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--black);
    color: var(--warm-white);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* ── HEADER ── */
  header {
    flex-shrink: 0;
    height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(16px, 4vw, 48px);
    border-bottom: 1px solid rgba(201,164,97,0.18);
    background: var(--black);
    z-index: 100;
  }
  .logo {
    font-family: var(--font-display);
    font-size: 1.1rem; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gold);
  }
  .logo small {
    display: block; font-family: var(--font-body);
    font-size: 0.55rem; font-weight: 500;
    letter-spacing: 0.35em; color: rgba(245,242,235,0.45);
    margin-top: 2px;
  }
  .nav-links { display: flex; align-items: center; gap: 4px; list-style: none; }
  .nav-links > li { position: relative; }
  .nav-links > li > a,
  .nav-links > li > button {
    padding: 8px 14px;
    font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(245,242,235,0.55);
    transition: color 0.2s;
  }
  .nav-links > li > a:hover,
  .nav-links > li > button:hover,
  .nav-links > li > a.active { color: var(--gold); }
  .has-dropdown > button::after { content: ' ▾'; opacity: 0.45; font-size: 0.85em; }
  .dropdown {
    position: absolute; top: calc(100% + 6px); left: 50%;
    transform: translateX(-50%) translateY(6px);
    min-width: 220px; padding: 6px;
    background: var(--anthracite);
    border: 1px solid rgba(201,164,97,0.2);
    border-radius: 3px;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
    box-shadow: 0 20px 40px rgba(0,0,0,0.55);
  }
  .has-dropdown:hover .dropdown,
  .has-dropdown.open .dropdown {
    opacity: 1; visibility: visible; pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .dropdown a {
    display: block; padding: 9px 12px;
    font-size: 0.76rem; color: rgba(245,242,235,0.72);
    border-radius: 2px;
  }
  .dropdown a:hover { background: rgba(139,92,246,0.1); color: var(--warm-white); }
  .dropdown .note {
    font-size: 0.65rem; color: rgba(245,242,235,0.35);
    padding: 6px 12px 2px; margin-top: 4px;
    border-top: 1px solid rgba(201,164,97,0.1);
  }
  .nav-toggle { display: none; flex-direction: column; gap: 5px; padding: 8px; }
  .nav-toggle span { display: block; width: 20px; height: 1px; background: var(--gold); }

  /* ── MAIN VIEWPORT ── */
  main {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .ecosystem-stage {
    position: relative;
    width: min(calc(100vh - var(--header-h) - var(--footer-h) - 24px), calc(100vw - 32px), 920px);
    height: min(calc(100vh - var(--header-h) - var(--footer-h) - 24px), calc(100vw - 32px), 920px);
  }

  .morph-frame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 38%;
    height: 38%;
    border-radius: 50%;
    border: 1px solid rgba(201,164,97,0.5);
    box-shadow:
      0 0 48px rgba(201,164,97,0.14),
      0 0 96px rgba(139,92,246,0.1),
      inset 0 0 48px rgba(201,164,97,0.05);
    overflow: hidden;
    background: radial-gradient(circle, rgba(28,28,31,0.5) 0%, var(--black) 70%);
    z-index: 3;
  }
  .morph-frame canvas { width: 100%; height: 100%; display: block; }

  .cables-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .cable-path { fill: none; stroke: rgba(139,92,246,0.2); stroke-width: 1; }
  .cable-glow { fill: none; stroke: url(#cableGrad); stroke-width: 1.5; opacity: 0.55; }
  .cable-pulse { fill: var(--violet); filter: drop-shadow(0 0 5px var(--violet)); }

  .pillar-node {
    position: absolute;
    width: clamp(130px, 16vw, 175px);
    transform: translate(-50%, -50%);
    z-index: 4;
  }
  .pillar-node-inner {
    background: rgba(28,28,31,0.92);
    border: 1px solid rgba(201,164,97,0.22);
    border-radius: 3px;
    padding: 10px 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .pillar-node:hover .pillar-node-inner,
  .pillar-node.expanded .pillar-node-inner {
    border-color: rgba(139,92,246,0.55);
    box-shadow: 0 0 20px rgba(139,92,246,0.18);
  }
  .pillar-num {
    font-size: 0.58rem; font-weight: 600;
    letter-spacing: 0.14em; color: var(--gold);
    margin-bottom: 4px;
  }
  .pillar-title {
    font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.03em; line-height: 1.25;
  }
  .pillar-desc {
    max-height: 0; overflow: hidden; opacity: 0;
    font-size: 0.68rem; font-weight: 400;
    color: rgba(245,242,235,0.58);
    line-height: 1.45;
    transition: max-height 0.3s ease, margin-top 0.3s ease, opacity 0.3s ease;
  }
  .pillar-node:hover .pillar-desc,
  .pillar-node.expanded .pillar-desc {
    max-height: 100px; margin-top: 8px; opacity: 1;
  }

  /* Mobile pillars — hidden on desktop */
  .pillar-mobile { display: none; }

  /* ── FOOTER ── */
  footer {
    flex-shrink: 0;
    height: var(--footer-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(16px, 4vw, 48px);
    border-top: 1px solid rgba(201,164,97,0.12);
    font-size: 0.62rem; letter-spacing: 0.08em;
    color: rgba(245,242,235,0.35);
  }
  footer a:hover { color: var(--gold); }

  /* ── MOBILE ── */
  @media (max-width: 900px) {
    .pillar-node, .cables-svg { display: none; }

    main {
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding: 12px 16px 8px;
      gap: 12px;
    }

    .ecosystem-stage {
      width: min(200px, 52vw);
      height: min(200px, 52vw);
      margin: 0 auto;
      flex-shrink: 0;
    }

    .morph-frame {
      position: relative;
      top: auto; left: auto;
      transform: none;
      width: 100%; height: 100%;
    }

    .pillar-mobile {
      display: block;
      flex: 1; min-height: 0;
      position: relative;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-left: 36px;
    }
    .pillar-mobile-line {
      position: fixed;
      left: 28px;
      top: calc(var(--header-h) + min(200px, 52vw) + 28px);
      bottom: var(--footer-h);
      width: 1px;
      background: linear-gradient(180deg, var(--violet), rgba(139,92,246,0.08));
      box-shadow: 0 0 10px var(--violet-dim);
      pointer-events: none;
    }
    .pillar-mobile-line::after {
      content: '';
      position: absolute; left: -2px; width: 5px; height: 5px;
      background: var(--violet); border-radius: 50%;
      box-shadow: 0 0 8px var(--violet);
      animation: flowDown 2.8s linear infinite;
    }
    @keyframes flowDown {
      0% { top: 0; opacity: 1; }
      100% { top: calc(100% - 5px); opacity: 0.2; }
    }
    .pillar-mobile-item { margin-bottom: 6px; position: relative; }
    .pillar-mobile-item::before {
      content: '';
      position: absolute; left: -22px; top: 14px;
      width: 8px; height: 8px;
      border: 1px solid var(--gold); border-radius: 50%;
      background: var(--black); z-index: 1;
    }
    .pillar-mobile-btn {
      width: 100%; text-align: left;
      background: var(--anthracite);
      border: 1px solid rgba(201,164,97,0.15);
      border-radius: 3px; padding: 10px 12px;
    }
    .pillar-mobile-item.open .pillar-mobile-btn { border-color: rgba(139,92,246,0.4); }
    .pillar-mobile-desc {
      display: none;
      padding: 8px 12px 10px;
      font-size: 0.72rem; color: rgba(245,242,235,0.55);
      border: 1px solid rgba(201,164,97,0.08);
      border-top: none; border-radius: 0 0 3px 3px;
    }
    .pillar-mobile-item.open .pillar-mobile-desc { display: block; }
  }

  @media (max-width: 768px) {
    .nav-toggle { display: flex; }
    .nav-links {
      position: fixed;
      top: var(--header-h); left: 0; right: 0;
      flex-direction: column; align-items: stretch;
      background: var(--anthracite);
      border-bottom: 1px solid rgba(201,164,97,0.15);
      padding: 12px;
      transform: translateY(-110%);
      opacity: 0; pointer-events: none;
      transition: transform 0.25s, opacity 0.25s;
    }
    body.menu-open .nav-links { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .dropdown {
      position: static; transform: none; opacity: 1; visibility: visible;
      pointer-events: auto; box-shadow: none; border: none;
      background: rgba(10,10,11,0.45); margin-top: 4px; display: none;
    }
    .has-dropdown.open .dropdown { display: block; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">AiPixxel<small>Consulting</small></a>
  <button class="nav-toggle" id="navToggle" aria-label="Meniu"><span></span><span></span><span></span></button>
  <ul class="nav-links" id="navLinks">
    <li><a href="/" class="active">Acasă</a></li>
    <li class="has-dropdown" id="servicesDropdown">
      <button type="button">Servicii</button>
      <div class="dropdown">
        <a href="/" data-pillar="0">Analiză de business</a>
        <a href="/strategie-marketing">Strategie de dezvoltare</a>
        <a href="/site-uri">Website-uri &amp; sisteme</a>
        <a href="/automatizari">Automatizări &amp; tools</a>

<main>
  <div class="ecosystem-stage" id="ecosystemStage">
    <svg class="cables-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#C9A461" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.85"/>
        </linearGradient>
      </defs>
      <g id="cablesGroup"></g>
    </svg>

    <div class="morph-frame" id="morphFrame">
      <canvas id="morphCanvas"></canvas>
    </div>

    <div id="pillarNodes"></div>
  </div>

  <div class="pillar-mobile-line" aria-hidden="true"></div>
  <div class="pillar-mobile" id="pillarMobile"></div>
</main>

<footer>
  <span>© 2026 AiPixxel · București</span>
  <a href="mailto:contact@aipixxel.online">contact@aipixxel.online</a>
</footer>

<script>
(function() {
  var PILLARS = [
    { num: '01', title: 'Cum aduci un client', desc: 'Profil client, triggeri de cumpărare, cât și când cheltuie — plus potențialul real de scalare.' },
    { num: '02', title: 'Planul de creștere', desc: 'Strategie sustenabilă pe termen mediu/lung, cu manual de implementare pentru achiziție și fidelizare.' },
    { num: '03', title: 'Infrastructura digitală', desc: 'Website-uri și sisteme cu baze de date — fundația pe care rulează tot restul.' },
    { num: '04', title: 'Sisteme interne', desc: 'Automatizări, agenți de suport, dashboard-uri și aplicații mobile.' },
    { num: '05', title: 'Achiziție plătită', desc: 'Campanii Ads social media optimizate pe date — nu pe presupuneri.' },
    { num: '06', title: 'Prezență socială', desc: 'Social media management AI. Recomandăm Posty — partener, nu serviciu AiPixxel.' },
    { num: '07', title: 'Fidelizare inteligentă', desc: 'Email marketing AI cu analiză și personalizare per client.' }
  ];

  var SHAPE_FILES = [
    'icons/01-factory.png', 'icons/03-car.png', 'icons/04-dining.png',
    'icons/06-store.png', 'icons/07-house.png', 'icons/08-code.png',
    'icons/09-finance.png', 'icons/05-coffee.png', 'icons/02-tools.png',
    'icons/10-fitness.png'
  ];

  var PARTICLE_COUNT = 850;
  var MORPH_MS = 1350;
  var HOLD_MS = 1900;
  var GOLD = [201, 164, 97];
  var VIOLET = [139, 92, 246];
  var CX = 500, CY = 500, FRAME_R = 195, NODE_R = 420;

  /* Nav */
  document.getElementById('navToggle').addEventListener('click', function() {
    document.body.classList.toggle('menu-open');
  });
  document.getElementById('servicesDropdown').querySelector('button').addEventListener('click', function(e) {
    if (window.innerWidth <= 768) {
      e.preventDefault();
      document.getElementById('servicesDropdown').classList.toggle('open');
    }
  });
  document.querySelectorAll('.dropdown a[data-pillar]').forEach(function(a) {
    a.addEventListener('click', function(e) {
      e.preventDefault();
      expandPillar(parseInt(a.getAttribute('data-pillar'), 10));
      document.body.classList.remove('menu-open');
    });
  });

  /* Pillars desktop */
  var cablesGroup = document.getElementById('cablesGroup');
  var pillarNodesEl = document.getElementById('pillarNodes');

  PILLARS.forEach(function(p, i) {
    var angle = (-Math.PI / 2) + (i * 2 * Math.PI / 7);
    var nx = CX + Math.cos(angle) * NODE_R;
    var ny = CY + Math.sin(angle) * NODE_R;
    var ex = CX + Math.cos(angle) * (FRAME_R + 6);
    var ey = CY + Math.sin(angle) * (FRAME_R + 6);
    var cpx = CX + Math.cos(angle) * (FRAME_R + NODE_R) * 0.42;
    var cpy = CY + Math.sin(angle) * (FRAME_R + NODE_R) * 0.42;
    var d = 'M' + ex + ',' + ey + ' Q' + cpx + ',' + cpy + ' ' + nx + ',' + ny;

    ['cable-path', 'cable-glow'].forEach(function(cls) {
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('class', cls);
      cablesGroup.appendChild(path);
    });

    var pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    pulse.setAttribute('r', '3');
    pulse.setAttribute('class', 'cable-pulse');
    var anim = document.createElementNS('http://www.w3.org/2000/svg', 'animateMotion');
    anim.setAttribute('dur', (2 + i * 0.12) + 's');
    anim.setAttribute('repeatCount', 'indefinite');
    anim.setAttribute('path', d);
    pulse.appendChild(anim);
    cablesGroup.appendChild(pulse);

    var node = document.createElement('div');
    node.className = 'pillar-node';
    node.style.left = (nx / 1000 * 100) + '%';
    node.style.top = (ny / 1000 * 100) + '%';
    node.setAttribute('data-index', i);
    node.innerHTML = '<div class="pillar-node-inner"><div class="pillar-num">' + p.num + '</div><div class="pillar-title">' + p.title + '</div><div class="pillar-desc">' + p.desc + '</div></div>';
    pillarNodesEl.appendChild(node);

    if (window.matchMedia('(hover: none)').matches) {
      node.addEventListener('click', function() { togglePillar(i); });
    }
  });

  /* Pillars mobile */
  var pillarMobile = document.getElementById('pillarMobile');
  PILLARS.forEach(function(p, i) {
    var item = document.createElement('div');
    item.className = 'pillar-mobile-item';
    item.setAttribute('data-index', i);
    item.innerHTML = '<button class="pillar-mobile-btn" type="button"><div class="pillar-num">' + p.num + '</div><div class="pillar-title">' + p.title + '</div></button><div class="pillar-mobile-desc">' + p.desc + '</div>';
    pillarMobile.appendChild(item);
    item.querySelector('button').addEventListener('click', function() { togglePillar(i); });
  });

  function togglePillar(idx) {
    document.querySelectorAll('.pillar-node').forEach(function(n) {
      var match = parseInt(n.getAttribute('data-index'), 10) === idx;
      n.classList.toggle('expanded', match ? !n.classList.contains('expanded') : false);
    });
    document.querySelectorAll('.pillar-mobile-item').forEach(function(item) {
      var match = parseInt(item.getAttribute('data-index'), 10) === idx;
      item.classList.toggle('open', match ? !item.classList.contains('open') : false);
    });
  }

  function expandPillar(idx) {
    document.querySelectorAll('.pillar-node, .pillar-mobile-item').forEach(function(el) {
      el.classList.remove('expanded', 'open');
    });
    var node = document.querySelector('.pillar-node[data-index="' + idx + '"]');
    if (node) node.classList.add('expanded');
    var m = document.querySelector('.pillar-mobile-item[data-index="' + idx + '"]');
    if (m) m.classList.add('open');
  }

  /* Particle morph */
  var canvas = document.getElementById('morphCanvas');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var shapes = [], fromShape = [], toShape = [];
  var shapeIdx = 0, morphT = 1, phase = 'hold', phaseStart = 0, breathPhase = 0;

  function resizeCanvas() {
    var size = document.getElementById('morphFrame').offsetWidth;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function extractPoints(img, count, threshold) {
    threshold = threshold || 28;
    var c = document.createElement('canvas');
    var w = img.naturalWidth || img.width;
    var h = img.naturalHeight || img.height;
    c.width = w; c.height = h;
    var cx = c.getContext('2d');
    cx.drawImage(img, 0, 0, w, h);
    var data = cx.getImageData(0, 0, w, h).data;
    var pts = [];
    var step = Math.max(2, Math.floor(Math.sqrt(w * h / (count * 2.5))));
    for (var y = 0; y < h; y += step) {
      for (var x = 0; x < w; x += step) {
        var i = (y * w + x) * 4;
        var lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        if (data[i + 3] > 25 && lum > threshold) {
          pts.push({ x: (x / w - 0.5) * 1.55, y: (y / h - 0.5) * 1.55 });
        }
      }
    }
    for (var j = pts.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = pts[j]; pts[j] = pts[k]; pts[k] = t;
    }
    while (pts.length < count) {
      var s = pts[Math.floor(Math.random() * Math.max(pts.length, 1))] || { x: 0, y: 0 };
      pts.push({ x: s.x + (Math.random() - 0.5) * 0.025, y: s.y + (Math.random() - 0.5) * 0.025 });
    }
    return pts.slice(0, count);
  }

  function cubicInOut(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function lerpColor(i, total) {
    var t = i / total;
    return 'rgb(' +
      Math.round(GOLD[0] + (VIOLET[0] - GOLD[0]) * t) + ',' +
      Math.round(GOLD[1] + (VIOLET[1] - GOLD[1]) * t) + ',' +
      Math.round(GOLD[2] + (VIOLET[2] - GOLD[2]) * t) + ')';
  }

  function loadShapes(cb) {
    var loaded = 0;
    SHAPE_FILES.forEach(function(src, idx) {
      var img = new Image();
      img.onload = function() { shapes[idx] = extractPoints(img, PARTICLE_COUNT); if (++loaded === SHAPE_FILES.length) cb(); };
      img.onerror = function() {
        shapes[idx] = Array.from({ length: PARTICLE_COUNT }, function(_, n) {
          var a = (n / PARTICLE_COUNT) * Math.PI * 2;
          return { x: Math.cos(a) * 0.4, y: Math.sin(a) * 0.4 };
        });
        if (++loaded === SHAPE_FILES.length) cb();
      };
      img.src = src;
    });
  }

  function startMorph() {
    fromShape = shapes[shapeIdx];
    shapeIdx = (shapeIdx + 1) % shapes.length;
    toShape = shapes[shapeIdx];
    morphT = 0; phase = 'morph'; phaseStart = performance.now();
  }

  function draw(now) {
    if (!fromShape.length) { requestAnimationFrame(draw); return; }
    var w = canvas.width / dpr, h = canvas.height / dpr;
    ctx.clearRect(0, 0, w, h);

    if (phase === 'hold' && now - phaseStart > HOLD_MS) startMorph();
    if (phase === 'morph') {
      morphT = Math.min(1, (now - phaseStart) / MORPH_MS);
      if (morphT >= 1) { phase = 'hold'; phaseStart = now; fromShape = toShape; }
    }

    var ease = phase === 'morph' ? cubicInOut(morphT) : 1;
    breathPhase += 0.018;
    var scale = Math.min(w, h) * 0.38 * (1 + Math.sin(breathPhase) * 0.035);
    var cx = w / 2, cy = h / 2;

    for (var i = 0; i < PARTICLE_COUNT; i++) {
      var fp = fromShape[i] || { x: 0, y: 0 };
      var tp = toShape[i] || fp;
      var src = phase === 'hold' ? fp : { x: fp.x + (tp.x - fp.x) * ease, y: fp.y + (tp.y - fp.y) * ease };
      ctx.beginPath();
      ctx.fillStyle = lerpColor(i, PARTICLE_COUNT);
      ctx.shadowBlur = 4;
      ctx.shadowColor = lerpColor(i, PARTICLE_COUNT);
      ctx.arc(cx + src.x * scale, cy + src.y * scale, 1.1 + (i % 3) * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  loadShapes(function() {
    fromShape = shapes[0];
    toShape = shapes[1];
    phase = 'hold';
    phaseStart = performance.now();
    requestAnimationFrame(draw);
  });
})();
</script>
</body>
</html>
