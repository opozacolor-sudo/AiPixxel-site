<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiPixxel — Consultanță marketing &amp; business</title>
<meta name="description" content="Orice afacere poate avea succes. AiPixxel leagă analiza de business cu execuția reală — strategie, ads, automatizări, email.">
<meta property="og:title" content="AiPixxel — Consultanță marketing &amp; business">
<meta property="og:description" content="Sistem integrat de creștere pentru companii care vor să scaleze cu date, nu cu intuiție.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aipixxel.online">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://aipixxel.online">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0A0A0B;
    --anthracite: #1C1C1F;
    --gold: #C9A461;
    --warm-white: #F5F2EB;
    --violet: #8B5CF6;
    --violet-dim: rgba(139,92,246,0.25);
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Outfit', system-ui, sans-serif;
    --header-h: 56px;
    --footer-h: 36px;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--black);
    color: var(--warm-white);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* ── HEADER ── */
  header {
    flex-shrink: 0;
    height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(16px, 4vw, 48px);
    border-bottom: 1px solid rgba(201,164,97,0.18);
    background: var(--black);
    z-index: 100;
  }
  .logo {
    font-family: var(--font-display);
    font-size: 1.1rem; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gold);
  }
  .logo small {
    display: block; font-family: var(--font-body);
    font-size: 0.55rem; font-weight: 500;
    letter-spacing: 0.35em; color: rgba(245,242,235,0.45);
    margin-top: 2px;
  }
  .nav-links { display: flex; align-items: center; gap: 4px; list-style: none; }
  .nav-links > li { position: relative; }
  .nav-links > li > a,
  .nav-links > li > button {
    padding: 8px 14px;
    font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(245,242,235,0.55);
    transition: color 0.2s;
  }
  .nav-links > li > a:hover,
  .nav-links > li > button:hover,
  .nav-links > li > a.active { color: var(--gold); }
  .has-dropdown > button::after { content: ' ▾'; opacity: 0.45; font-size: 0.85em; }
  .dropdown {
    position: absolute; top: calc(100% + 6px); left: 50%;
    transform: translateX(-50%) translateY(6px);
    min-width: 220px; padding: 6px;
    background: var(--anthracite);
    border: 1px solid rgba(201,164,97,0.2);
    border-radius: 3px;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
    box-shadow: 0 20px 40px rgba(0,0,0,0.55);
  }
  .has-dropdown:hover .dropdown,
  .has-dropdown.open .dropdown {
    opacity: 1; visibility: visible; pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .dropdown a {
    display: block; padding: 9px 12px;
    font-size: 0.76rem; color: rgba(245,242,235,0.72);
    border-radius: 2px;
  }
  .dropdown a:hover { background: rgba(139,92,246,0.1); color: var(--warm-white); }
  .dropdown .note {
    font-size: 0.65rem; color: rgba(245,242,235,0.35);
    padding: 6px 12px 2px; margin-top: 4px;
    border-top: 1px solid rgba(201,164,97,0.1);
  }
  .nav-toggle { display: none; flex-direction: column; gap: 5px; padding: 8px; }
  .nav-toggle span { display: block; width: 20px; height: 1px; background: var(--gold); }

  /* ── MAIN VIEWPORT ── */
  main {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .ecosystem-stage {
    position: relative;
    width: min(calc(100vh - var(--header-h) - var(--footer-h) - 32px), calc(100vw - 40px), 820px);
    height: min(calc(100vh - var(--header-h) - var(--footer-h) - 32px), calc(100vw - 40px), 820px);
  }

  .morph-frame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 38%;
    height: 38%;
    border-radius: 50%;
    border: 1px solid rgba(201,164,97,0.5);
    box-shadow:
      0 0 48px rgba(201,164,97,0.14),
      0 0 96px rgba(139,92,246,0.1),
      inset 0 0 48px rgba(201,164,97,0.05);
    overflow: hidden;
    background: radial-gradient(circle, rgba(28,28,31,0.5) 0%, var(--black) 70%);
    z-index: 3;
  }
  .morph-frame canvas { width: 100%; height: 100%; display: block; }

  .cables-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .cable-base {
    fill: none;
    stroke: url(#cableGrad);
    stroke-width: 1.2;
    opacity: 0.4;
    transition: opacity 0.25s;
  }
  .cable-base.active { opacity: 0.92; }
  .cable-pulse {
    fill: var(--violet);
    filter: drop-shadow(0 0 6px var(--violet));
  }

  .edu-node {
    position: absolute;
    width: 64px; height: 64px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--anthracite);
    border: 1px solid rgba(201,164,97,0.45);
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    font-size: 0.58rem; font-weight: 600;
    letter-spacing: 0.02em; line-height: 1.15;
    padding: 6px;
    cursor: pointer;
    z-index: 5;
    transition: transform 0.22s, box-shadow 0.22s, border-color 0.22s;
  }
  .edu-node:hover,
  .edu-node:focus-visible {
    transform: translate(-50%, -50%) scale(1.08);
    border-color: rgba(139,92,246,0.6);
    box-shadow: 0 0 28px rgba(139,92,246,0.4);
    outline: none;
  }

  .edu-mobile { display: none; }

  .modal-backdrop {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(10,10,11,0.88);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
    backdrop-filter: blur(6px);
  }
  .modal-backdrop.open { display: flex; }
  .modal-panel {
    position: relative;
    width: min(640px, 100%);
    max-height: min(85vh, 720px);
    overflow-y: auto;
    background: var(--anthracite);
    border: 1px solid rgba(201,164,97,0.28);
    border-radius: 4px;
    padding: 28px 28px 32px;
    box-shadow: 0 32px 64px rgba(0,0,0,0.55);
  }
  .modal-close {
    position: absolute; top: 14px; right: 14px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(201,164,97,0.25);
    color: rgba(245,242,235,0.6);
    font-size: 1.1rem; line-height: 1;
    transition: border-color 0.2s, color 0.2s;
  }
  .modal-close:hover { border-color: var(--violet); color: var(--warm-white); }
  .modal-panel h2 {
    font-family: var(--font-display);
    font-size: 1.45rem; font-weight: 600;
    color: var(--gold);
    padding-right: 36px;
    margin-bottom: 20px;
  }
  .lesson-body h3 {
    font-family: var(--font-display);
    font-size: 1.05rem; font-weight: 600;
    color: var(--warm-white);
    margin: 1.4em 0 0.6em;
  }
  .lesson-body h3:first-child { margin-top: 0; }
  .lesson-body p,
  .lesson-body li {
    font-size: 0.88rem; font-weight: 400;
    color: rgba(245,242,235,0.72);
    line-height: 1.65;
    margin-bottom: 0.75em;
  }
  .lesson-body ul { padding-left: 1.2em; margin-bottom: 0.75em; }
  .lesson-body pre {
    background: rgba(10,10,11,0.65);
    border: 1px solid rgba(201,164,97,0.15);
    border-radius: 3px;
    padding: 12px 14px;
    margin: 12px 0;
    overflow-x: auto;
  }
  .lesson-body code {
    font-family: 'Outfit', monospace;
    font-size: 0.82rem;
    color: var(--gold);
  }
  .lesson-body strong { color: rgba(245,242,235,0.92); }

  /* ── FOOTER ── */
  footer {
    flex-shrink: 0;
    height: var(--footer-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(16px, 4vw, 48px);
    border-top: 1px solid rgba(201,164,97,0.12);
    font-size: 0.62rem; letter-spacing: 0.08em;
    color: rgba(245,242,235,0.35);
  }
  footer a:hover { color: var(--gold); }

  @media (max-width: 900px) {
    main {
      flex-direction: column;
      justify-content: flex-start;
      padding: 10px 16px 8px;
      gap: 10px;
      overflow: hidden;
    }
    .ecosystem-stage {
      width: min(168px, 44vw);
      height: min(168px, 44vw);
      flex-shrink: 0;
      margin: 0 auto;
    }
    .morph-frame {
      position: relative;
      top: auto; left: auto;
      transform: none;
      width: 100%; height: 100%;
    }
    .cables-svg, .edu-node { display: none; }
    .edu-mobile {
      display: block;
      flex: 1; min-height: 0;
      position: relative;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-left: 28px;
    }
    .edu-mobile-line {
      position: absolute; left: 8px; top: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(180deg, var(--violet), rgba(139,92,246,0.08));
      box-shadow: 0 0 10px var(--violet-dim);
    }
    .edu-mobile-line::after {
      content: '';
      position: absolute; left: -2px; width: 5px; height: 5px;
      background: var(--violet); border-radius: 50%;
      box-shadow: 0 0 8px var(--violet);
      animation: flowDown 3s linear infinite;
    }
    @keyframes flowDown {
      0% { top: 0; opacity: 1; }
      100% { top: calc(100% - 5px); opacity: 0.2; }
    }
    .edu-mobile-card {
      position: relative;
      margin-bottom: 8px;
      padding-left: 20px;
    }
    .edu-mobile-card::before {
      content: '';
      position: absolute; left: -16px; top: 50%;
      width: 8px; height: 8px;
      transform: translateY(-50%);
      border: 1px solid var(--gold);
      border-radius: 50%;
      background: var(--black);
    }
    .edu-mobile-card button {
      width: 100%; text-align: left;
      background: var(--anthracite);
      border: 1px solid rgba(201,164,97,0.18);
      border-radius: 3px;
      padding: 12px 14px;
      font-size: 0.78rem; font-weight: 600;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .edu-mobile-card button:hover {
      border-color: rgba(139,92,246,0.45);
      box-shadow: 0 0 16px rgba(139,92,246,0.15);
    }
  }

  @media (max-width: 768px) {
    .nav-toggle { display: flex; }
    .nav-links {
      position: fixed;
      top: var(--header-h); left: 0; right: 0;
      flex-direction: column; align-items: stretch;
      background: var(--anthracite);
      border-bottom: 1px solid rgba(201,164,97,0.15);
      padding: 12px;
      transform: translateY(-110%);
      opacity: 0; pointer-events: none;
      transition: transform 0.25s, opacity 0.25s;
    }
    body.menu-open .nav-links { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .dropdown {
      position: static; transform: none; opacity: 1; visibility: visible;
      pointer-events: auto; box-shadow: none; border: none;
      background: rgba(10,10,11,0.45); margin-top: 4px; display: none;
    }
    .has-dropdown.open .dropdown { display: block; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">AiPixxel<small>Consulting</small></a>
  <button class="nav-toggle" id="navToggle" aria-label="Meniu"><span></span><span></span><span></span></button>
  <ul class="nav-links" id="navLinks">

    <li class="has-dropdown" id="servicesDropdown">
      <button type="button">Servicii</button>
      <div class="dropdown">
        <a href="/strategie-marketing">Analiză de business</a>
        <a href="/strategie-marketing">Strategie de dezvoltare</a>
        <a href="/site-uri">Website-uri &amp; sisteme</a>
        <a href="/automatizari">Automatizări &amp; tools</a>

<main>
  <div class="ecosystem-stage" id="ecosystemStage">
    <svg class="cables-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#C9A461"/>
          <stop offset="100%" stop-color="#8B5CF6"/>
        </linearGradient>
      </defs>
      <g id="cablesGroup"></g>

    <div class="morph-frame" id="morphFrame">
      <canvas id="morphCanvas"></canvas>

<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" type="button" aria-label="Închide">×</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>

<footer>
  <span>© 2026 AiPixxel · București</span>
  <a href="mailto:contact@aipixxel.online">contact@aipixxel.online</a>
</footer>

<script src="nodes-content.js"></script>
<script>
(function() {
  var CX = 500, CY = 500, FRAME_R = 190, NODE_R = 430;

  /* ── Modal ── */
  var modal = document.getElementById('modalBackdrop');
  var modalTitle = document.getElementById('modalTitle');
  var modalBody = document.getElementById('modalBody');

  function openModal(node) {
    modalTitle.textContent = node.subtitlu;
    modalBody.innerHTML = node.continutPopup;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = 'hidden';
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  modal.addEventListener('click', function(e) {
    if (e.target === modal) closeModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  /* ── Edu nodes + cables ── */
  var cablesGroup = document.getElementById('cablesGroup');
  var eduNodesEl = document.getElementById('eduNodes');
  var eduMobile = document.getElementById('eduMobile');
  var cableEls = [];

  EDU_NODES.forEach(function(node, i) {
    var angle = (-Math.PI / 2) + (i * Math.PI / 4);
    var nx = CX + Math.cos(angle) * NODE_R;
    var ny = CY + Math.sin(angle) * NODE_R;
    var ex = CX + Math.cos(angle) * (FRAME_R + 4);
    var ey = CY + Math.sin(angle) * (FRAME_R + 4);
    var cpx = CX + Math.cos(angle) * (FRAME_R + NODE_R) * 0.4;
    var cpy = CY + Math.sin(angle) * (FRAME_R + NODE_R) * 0.4;
    var d = 'M' + ex + ',' + ey + ' Q' + cpx + ',' + cpy + ' ' + nx + ',' + ny;

    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'cable-base');
    path.setAttribute('data-cable', i);
    cablesGroup.appendChild(path);
    cableEls.push(path);

    var pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    pulse.setAttribute('r', '3');
    pulse.setAttribute('class', 'cable-pulse');
    var anim = document.createElementNS('http://www.w3.org/2000/svg', 'animateMotion');
    anim.setAttribute('dur', (2.5 + Math.random() * 1).toFixed(2) + 's');
    anim.setAttribute('repeatCount', 'indefinite');
    anim.setAttribute('path', d);
    pulse.appendChild(anim);
    cablesGroup.appendChild(pulse);

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'edu-node';
    btn.style.left = (nx / 1000 * 100) + '%';
    btn.style.top = (ny / 1000 * 100) + '%';
    btn.textContent = node.titluScurt;
    btn.setAttribute('aria-label', node.subtitlu);
    btn.addEventListener('click', function() { openModal(node); });
    btn.addEventListener('mouseenter', function() { cableEls[i].classList.add('active'); });
    btn.addEventListener('mouseleave', function() { cableEls[i].classList.remove('active'); });
    btn.addEventListener('focus', function() { cableEls[i].classList.add('active'); });
    btn.addEventListener('blur', function() { cableEls[i].classList.remove('active'); });
    eduNodesEl.appendChild(btn);

    var card = document.createElement('div');
    card.className = 'edu-mobile-card';
    var mBtn = document.createElement('button');
    mBtn.type = 'button';
    mBtn.textContent = node.titluScurt;
    mBtn.addEventListener('click', function() { openModal(node); });
    card.appendChild(mBtn);
    eduMobile.appendChild(card);
  });

  var SHAPE_FILES = [
    'icons/01-factory.png', 'icons/03-car.png', 'icons/04-dining.png',
    'icons/06-store.png', 'icons/07-house.png', 'icons/08-code.png',
    'icons/09-finance.png', 'icons/05-coffee.png', 'icons/02-tools.png',
    'icons/10-fitness.png'
  ];

  var PARTICLE_COUNT = 850;
  var MORPH_MS = 1350;
  var HOLD_MS = 1900;
  var GOLD = [201, 164, 97];
  var VIOLET = [139, 92, 246];

  document.getElementById('navToggle').addEventListener('click', function() {
    document.body.classList.toggle('menu-open');
  });
  document.getElementById('servicesDropdown').querySelector('button').addEventListener('click', function(e) {
    if (window.innerWidth <= 768) {
      e.preventDefault();
      document.getElementById('servicesDropdown').classList.toggle('open');
    }
  });

  /* Particle morph */
  var canvas = document.getElementById('morphCanvas');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var shapes = [], fromShape = [], toShape = [];
  var shapeIdx = 0, morphT = 1, phase = 'hold', phaseStart = 0, breathPhase = 0;

  function resizeCanvas() {
    var size = document.getElementById('morphFrame').offsetWidth;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function extractPoints(img, count, threshold) {
    threshold = threshold || 28;
    var c = document.createElement('canvas');
    var w = img.naturalWidth || img.width;
    var h = img.naturalHeight || img.height;
    c.width = w; c.height = h;
    var cx = c.getContext('2d');
    cx.drawImage(img, 0, 0, w, h);
    var data = cx.getImageData(0, 0, w, h).data;
    var pts = [];
    var step = Math.max(2, Math.floor(Math.sqrt(w * h / (count * 2.5))));
    for (var y = 0; y < h; y += step) {
      for (var x = 0; x < w; x += step) {
        var i = (y * w + x) * 4;
        var lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        if (data[i + 3] > 25 && lum > threshold) {
          pts.push({ x: (x / w - 0.5) * 1.55, y: (y / h - 0.5) * 1.55 });
        }
      }
    }
    for (var j = pts.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = pts[j]; pts[j] = pts[k]; pts[k] = t;
    }
    while (pts.length < count) {
      var s = pts[Math.floor(Math.random() * Math.max(pts.length, 1))] || { x: 0, y: 0 };
      pts.push({ x: s.x + (Math.random() - 0.5) * 0.025, y: s.y + (Math.random() - 0.5) * 0.025 });
    }
    return pts.slice(0, count);
  }

  function cubicInOut(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function lerpColor(i, total) {
    var t = i / total;
    return 'rgb(' +
      Math.round(GOLD[0] + (VIOLET[0] - GOLD[0]) * t) + ',' +
      Math.round(GOLD[1] + (VIOLET[1] - GOLD[1]) * t) + ',' +
      Math.round(GOLD[2] + (VIOLET[2] - GOLD[2]) * t) + ')';
  }

  function loadShapes(cb) {
    var loaded = 0;
    SHAPE_FILES.forEach(function(src, idx) {
      var img = new Image();
      img.onload = function() { shapes[idx] = extractPoints(img, PARTICLE_COUNT); if (++loaded === SHAPE_FILES.length) cb(); };
      img.onerror = function() {
        shapes[idx] = Array.from({ length: PARTICLE_COUNT }, function(_, n) {
          var a = (n / PARTICLE_COUNT) * Math.PI * 2;
          return { x: Math.cos(a) * 0.4, y: Math.sin(a) * 0.4 };
        });
        if (++loaded === SHAPE_FILES.length) cb();
      };
      img.src = src;
    });
  }

  function startMorph() {
    fromShape = shapes[shapeIdx];
    shapeIdx = (shapeIdx + 1) % shapes.length;
    toShape = shapes[shapeIdx];
    morphT = 0; phase = 'morph'; phaseStart = performance.now();
  }

  function draw(now) {
    if (!fromShape.length) { requestAnimationFrame(draw); return; }
    var w = canvas.width / dpr, h = canvas.height / dpr;
    ctx.clearRect(0, 0, w, h);

    if (phase === 'hold' && now - phaseStart > HOLD_MS) startMorph();
    if (phase === 'morph') {
      morphT = Math.min(1, (now - phaseStart) / MORPH_MS);
      if (morphT >= 1) { phase = 'hold'; phaseStart = now; fromShape = toShape; }
    }

    var ease = phase === 'morph' ? cubicInOut(morphT) : 1;
    breathPhase += 0.018;
    var scale = Math.min(w, h) * 0.38 * (1 + Math.sin(breathPhase) * 0.035);
    var cx = w / 2, cy = h / 2;

    for (var i = 0; i < PARTICLE_COUNT; i++) {
      var fp = fromShape[i] || { x: 0, y: 0 };
      var tp = toShape[i] || fp;
      var src = phase === 'hold' ? fp : { x: fp.x + (tp.x - fp.x) * ease, y: fp.y + (tp.y - fp.y) * ease };
      ctx.beginPath();
      ctx.fillStyle = lerpColor(i, PARTICLE_COUNT);
      ctx.shadowBlur = 4;
      ctx.shadowColor = lerpColor(i, PARTICLE_COUNT);
      ctx.arc(cx + src.x * scale, cy + src.y * scale, 1.1 + (i % 3) * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  loadShapes(function() {
    fromShape = shapes[0];
    toShape = shapes[1];
    phase = 'hold';
    phaseStart = performance.now();
    requestAnimationFrame(draw);
  });
})();
</script>
</body>
</html>
